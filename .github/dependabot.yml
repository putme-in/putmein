version: 2
updates:
  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for root npm package
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain dependencies for Ray (Next.js dashboard)
  - package-ecosystem: "npm"
    directory: "/ray"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for Landing (marketing site)
  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Go modules for Brain
  - package-ecosystem: "gomod"
    directory: "/brain"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
